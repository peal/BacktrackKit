name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: GAP ${{ matrix.gap-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        gap-version: [devel, latest, minimal]
        include:
          - os: windows
            gap-version: devel

    steps:
      - uses: actions/checkout@v6
      - uses: gap-actions/setup-cygwin@v2
        if: ${{ runner.os == 'Windows' }}
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: ${{ matrix.gap-version }}
      - uses: gap-actions/install-pkg@v1
        with:
          packages: |
            ChrisJefferson/QuickCheck@devel
      - uses: gap-actions/build-pkg@v3
        with:
          extra-pkgs: quickcheck
      - uses: gap-actions/run-pkg-tests@v4
        with:
          coverage: ${{ runner.os != 'Windows' }}
      - uses: gap-actions/run-pkg-tests@v4
        with:
          mode: onlyneeded
          coverage: false
      - uses: gap-actions/process-coverage@v3
        if: ${{ runner.os != 'Windows' }}
      - uses: codecov/codecov-action@v6
        if: ${{ runner.os != 'Windows' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gap-coverage.json
